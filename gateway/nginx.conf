events {}

http {
    upstream auth_service {
        server auth-service:8001;
    }
    upstream event_service {
        server event-service:8002;
    }
    upstream rsvp_service {
        server rsvp-service:8003;
    }

    server {
        listen 80;

        location /api/auth/ {
            proxy_pass http://auth_service/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/events/ {
            proxy_pass http://event_service/api/events/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/rsvp/ {
            proxy_pass http://rsvp_service/api/rsvp/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket route → Notification Service
        location /ws/ {
            proxy_pass http://notification-service:8004;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
